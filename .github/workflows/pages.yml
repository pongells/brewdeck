name: Web demo

# Builds sim/web (the real UI + a fake machine, compiled to WebAssembly) and publishes it on GitHub Pages.
# One-time setup: Settings > Pages > Source: "GitHub Actions". Skipped while the repository is private.
# Runs after CI passed on main, so a push that breaks the checks never reaches the published demo.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:   # deploys wait their turn instead of cancelling each other (a cancelled run marks its commit as failing)
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !github.event.repository.private && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}   # the commit CI checked
      - uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984   # v16
      - name: Build the web demo
        run: sim/web/build.sh
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: sim/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
