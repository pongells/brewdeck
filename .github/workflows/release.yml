name: Release

# A tag like v0.1.0 builds the release images (no debug web server, no Wi-Fi network built in) and publishes them as
# one GitHub release: brewdeck-<tag>-esp32s3.zip and brewdeck-<tag>-esp32p4.zip (images, flash.sh,
# SHA256SUMS, INSTALL.txt), notes from CHANGELOG.md. For updates over Wi-Fi (ESP32-P4) also brewdeck-<tag>-esp32p4.bin
# and its signed description update-esp32p4.txt (tools/sign-update.sh, key in the UPDATE_SIGNING_KEY secret).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    # one job per board: the two need differently compiled Arduino libraries, and pioarduino keeps one copy
    name: Build the ${{ matrix.board }} package
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board: [s3, p4]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # the tags: the firmware's version comes from git describe
      - name: Unit tests
        run: tests/run.sh
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2   # v10.3.3 (Node 24)
      - uses: actions/cache@v6
        with:
          path: ~/.platformio-brewdeck
          # the same caches as CI (s3: platformio-..., p4: platformio-p4-...)
          key: platformio-${{ matrix.board == 'p4' && 'p4-' || '' }}${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: platformio-${{ matrix.board == 'p4' && 'p4-' || '' }}${{ runner.os }}-
      - name: Build and package
        env:
          UPDATE_SIGNING_KEY: ${{ matrix.board == 'p4' && secrets.UPDATE_SIGNING_KEY || '' }}
        run: |
          # pioarduino can install a pioarduino package its own version check rejects (6.2.0.post1 vs >=6.2.0)
          tools/make-release.sh "$GITHUB_REF_NAME" ${{ matrix.board }} || { uv pip install --python ~/.platformio-brewdeck/penv/bin/python pioarduino==6.2.0 && tools/make-release.sh "$GITHUB_REF_NAME" ${{ matrix.board }}; }
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.board }}
          path: |
            dist/*.zip
            dist/*.bin
            dist/update-*.txt
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          # the section "## <tag> ..." up to the next "## "
          awk -v t="$GITHUB_REF_NAME" '$0 ~ "^## " {p = ($2 == t)} p' CHANGELOG.md | tail -n +2 > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $GITHUB_REF_NAME"; exit 1; }
          {
            echo
            echo "Install: download the zip for your board, read INSTALL.txt (backup first)."
            echo "- \`brewdeck-$GITHUB_REF_NAME-esp32s3.zip\`: Sunton ESP32-S3 screen"
            echo "- \`brewdeck-$GITHUB_REF_NAME-esp32p4.zip\`: Guition ESP32-P4 board"
            echo
            echo "SHA-256:"
            echo '```'
            (cd dist && sha256sum *.zip)
            echo '```'
          } >> notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the update files must be there: screens find a release by update-esp32p4.txt
          test -s dist/update-esp32p4.txt && test -s "dist/brewdeck-$GITHUB_REF_NAME-esp32p4.bin"
          gh release create "$GITHUB_REF_NAME" "dist/brewdeck-$GITHUB_REF_NAME-esp32s3.zip" \
            "dist/brewdeck-$GITHUB_REF_NAME-esp32p4.zip" "dist/brewdeck-$GITHUB_REF_NAME-esp32p4.bin" \
            dist/update-esp32p4.txt --title "Brewdeck $GITHUB_REF_NAME" --notes-file notes.md
