name: Release

# A tag like v0.1.0 builds the release images (no debug web server, no Wi-Fi network built in) and publishes them as
# one GitHub release: brewdeck-<tag>-esp32s3.zip and brewdeck-<tag>-esp32p4.zip (images, flash.sh,
# SHA256SUMS, INSTALL.txt), notes from CHANGELOG.md. For updates over Wi-Fi (ESP32-P4) also brewdeck-<tag>-esp32p4.bin
# and its signed description update-esp32p4.txt (tools/sign-update.sh, key in the UPDATE_SIGNING_KEY secret), and the
# interfaces a P4 screen can switch to: brewdeck-<tag>-<ui>-esp32p4.bin per UI listed in uis.json, built against this
# release's core, and their signed catalogue catalog-esp32p4.txt (tools/uis.py catalog).
# The signing key never meets other people's code: the UIs are built in jobs without secrets (caches only restored),
# and the catalog job runs only this repository's tools/uis.py on their images.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    # one job per board: the two need differently compiled Arduino libraries, and pioarduino keeps one copy
    name: Build the ${{ matrix.board }} package
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board: [s3, p4]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # the tags: the firmware's version comes from git describe
      - name: Unit tests
        run: tests/run.sh
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2   # v10.3.3 (Node 24)
      - uses: actions/cache@v6
        with:
          path: ~/.platformio-brewdeck
          # the same caches as CI (s3: platformio-..., p4: platformio-p4-...)
          key: platformio-${{ matrix.board == 'p4' && 'p4-' || '' }}${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: platformio-${{ matrix.board == 'p4' && 'p4-' || '' }}${{ runner.os }}-
      - name: Build and package
        env:
          UPDATE_SIGNING_KEY: ${{ matrix.board == 'p4' && secrets.UPDATE_SIGNING_KEY || '' }}
        run: |
          # pioarduino can install a pioarduino package its own version check rejects (6.2.0.post1 vs >=6.2.0)
          tools/make-release.sh "$GITHUB_REF_NAME" ${{ matrix.board }} || { uv pip install --python ~/.platformio-brewdeck/penv/bin/python pioarduino==6.2.0 && tools/make-release.sh "$GITHUB_REF_NAME" ${{ matrix.board }}; }
      - name: Brewdeck's P4 image for the interface catalogue
        if: matrix.board == 'p4'
        run: mkdir -p images && cp firmware/.pio/build/ui-p4/firmware.bin images/screen.bin
      - if: matrix.board == 'p4'
        uses: actions/upload-artifact@v7
        with:
          name: ui-image-screen
          path: images/screen.bin
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.board }}
          path: |
            dist/*.zip
            dist/*.bin
            dist/update-*.txt
          if-no-files-found: error

  ui-list:
    name: Read uis.json
    runs-on: ubuntu-latest
    outputs:
      names: ${{ steps.m.outputs.names }}
    steps:
      - uses: actions/checkout@v7
      - id: m
        run: |
          tools/uis.py validate
          echo "names=$(tools/uis.py matrix)" >> "$GITHUB_OUTPUT"

  ui-images:
    # other people's code: no secrets in this job, the build cache only restored
    name: Build the ${{ matrix.ui }} interface (P4)
    needs: ui-list
    if: needs.ui-list.outputs.names != '[]'
    runs-on: ubuntu-latest
    continue-on-error: true   # a UI that does not build is left out of the catalogue, the release goes on
    strategy:
      fail-fast: false
      matrix:
        ui: ${{ fromJSON(needs.ui-list.outputs.names) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # the tags: the firmware's version comes from git describe
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2   # v10.3.3 (Node 24)
      - uses: actions/cache/restore@v6
        with:
          path: ~/.platformio-brewdeck
          key: platformio-p4-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: platformio-p4-${{ runner.os }}-
      - name: Fetch the UI at its pinned commit
        run: echo "UI_DIR=$(tools/uis.py fetch ${{ matrix.ui }} "$RUNNER_TEMP/ui")" >> "$GITHUB_ENV"
      - name: Build its release image
        working-directory: firmware
        run: |
          cp include/wifi_config.example.h include/wifi_config.h   # no network built in, as every release image
          UI="$UI_DIR" ./build.sh ui-p4 || { uv pip install --python ~/.platformio-brewdeck/penv/bin/python pioarduino==6.2.0 && UI="$UI_DIR" ./build.sh ui-p4; }
          mkdir -p ../images && cp .pio/build/ui-p4/firmware.bin ../images/${{ matrix.ui }}.bin
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev && pip install pillow
      - name: Its Ready screen (the emulator, a fake machine) as the catalogue's preview
        run: tools/release-preview.sh "$UI_DIR" images/${{ matrix.ui }}.preview
      - uses: actions/upload-artifact@v7
        with:
          name: ui-image-${{ matrix.ui }}
          path: |
            images/${{ matrix.ui }}.bin
            images/${{ matrix.ui }}.preview
          if-no-files-found: error

  screen-preview:
    name: Brewdeck's Ready screen for the catalogue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev && pip install pillow
      - run: tools/release-preview.sh ui images/screen.preview
      - uses: actions/upload-artifact@v7
        with:
          name: ui-preview-screen
          path: images/screen.preview
          if-no-files-found: error

  catalog:
    # runs only this repository's tools/uis.py on the images (data): the one job besides the package build with the key
    name: Sign the interface catalogue
    needs: [build, ui-images, screen-preview]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: ui-*
          path: images
          merge-multiple: true
      - name: Sign
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          KEYF="$(mktemp)"
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$KEYF"
          ok=0; tools/uis.py catalog "$GITHUB_REF_NAME" esp32p4 images "$KEYF" dist || ok=$?
          rm -f "$KEYF"
          exit $ok
      - uses: actions/upload-artifact@v7
        with:
          name: catalog
          path: |
            dist/catalog-esp32p4.txt
            dist/brewdeck-*-*-esp32p4.bin
            dist/preview-*.rgb565
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [build, catalog]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          # the section "## <tag> ..." up to the next "## "
          awk -v t="$GITHUB_REF_NAME" '$0 ~ "^## " {p = ($2 == t)} p' CHANGELOG.md | tail -n +2 > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $GITHUB_REF_NAME"; exit 1; }
          {
            echo
            echo "Install: download the zip for your board, read INSTALL.txt (backup first)."
            echo "- \`brewdeck-$GITHUB_REF_NAME-esp32s3.zip\`: Sunton ESP32-S3 screen"
            echo "- \`brewdeck-$GITHUB_REF_NAME-esp32p4.zip\`: Guition ESP32-P4 board"
            echo
            echo "SHA-256:"
            echo '```'
            (cd dist && sha256sum *.zip)
            echo '```'
          } >> notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the update files must be there: screens find a release by update-esp32p4.txt
          test -s dist/update-esp32p4.txt && test -s "dist/brewdeck-$GITHUB_REF_NAME-esp32p4.bin" && test -s dist/catalog-esp32p4.txt
          gh release create "$GITHUB_REF_NAME" "dist/brewdeck-$GITHUB_REF_NAME-esp32s3.zip" \
            "dist/brewdeck-$GITHUB_REF_NAME-esp32p4.zip" "dist/brewdeck-$GITHUB_REF_NAME-esp32p4.bin" \
            dist/update-esp32p4.txt dist/catalog-esp32p4.txt $(ls dist/brewdeck-$GITHUB_REF_NAME-*-esp32p4.bin dist/preview-*.rgb565 2>/dev/null) \
            --title "Brewdeck $GITHUB_REF_NAME" --notes-file notes.md
