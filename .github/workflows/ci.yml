name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:   # a newer push to a PR replaces its running checks; every push to main runs to the end (a cancelled run
  group: ci-${{ github.ref }}                 # there marks the commit as not passing)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Unit tests (parsers, decoders, command rules; ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: tests/run.sh

  sim:
    name: Simulator renders and emulator build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - run: pip install pillow
      - name: Render every screen with the real UI code
        run: sim/build-render.sh && sim/render sim/out && python3 sim/topng.py sim/out
      - name: Build the emulator
        run: sim/build-emu.sh
      - name: Build the emulator with the example UI (src/ui_minimal uses only the core API)
        run: UI=ui_minimal sim/build-emu.sh
      - name: Build the emulator with a UI kept outside the repository (a copy of the example)
        run: cp -r firmware/src/ui_minimal "$RUNNER_TEMP/outside-ui" && UI="$RUNNER_TEMP/outside-ui" sim/build-emu.sh
      - name: Shared UI scenarios (docs/ui-features.md) on Brewdeck's UI and the example UI
        run: tests/ui/run.sh && tests/ui/run.sh ui_minimal
      - name: Keep the scenario logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-scenarios
          path: tests/ui/out/
      - uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984   # v16
      - name: Build the web demo (deployed by pages.yml once the repository is public)
        run: sim/web/build.sh
      - name: Keep the renders (look at them to review a UI change)
        uses: actions/upload-artifact@v7
        with:
          name: screen-renders
          path: sim/out/*.png

  firmware:
    # ESP-IDF projects built with idf.py (firmware/build.sh); ESP-IDF and the build folders are cached
    name: Firmware (release and debug builds, the example UI, the touch test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/esp-idf
        with:
          builds-key: s3
      - name: Build
        working-directory: firmware
        run: |
          ./build.sh ui
          ./build.sh ui-debug
          UI=ui_minimal ./build.sh ui   # the example UI: proves a UI builds on the core API alone
          cp -r src/ui_minimal "$RUNNER_TEMP/outside-ui" && UI="$RUNNER_TEMP/outside-ui" ./build.sh ui   # a UI outside the repository
          UI=touchtest ./build.sh ui    # the touch test

  firmware-p4:
    name: Firmware, ESP32-P4 board (release and debug builds, the example UI, the C6 updater)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/esp-idf
        with:
          builds-key: p4
      - name: Build
        working-directory: firmware
        run: |
          ./build.sh ui-p4
          ./build.sh ui-p4-debug
          UI=ui_minimal ./build.sh ui-p4
          cp -r src/ui_minimal "$RUNNER_TEMP/outside-ui" && UI="$RUNNER_TEMP/outside-ui" ./build.sh ui-p4
          ./build.sh p4-c6-update
