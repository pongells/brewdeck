; Brewdeck (unofficial Wi-Fi screen for Gaggiuino machines): two boards, one core and UI.
;   S3 (envs ui, ui-debug, touchtest; the default): 4.3" 800x480 ESP32-S3 RGB panel, Sunton ESP32-8048S043-style
;      board (N16R8, also the Gaggiuino Gen 3 screen). Built with a custom sdkconfig ([s3] below): the libraries are
;      recompiled with the settings Espressif recommends for an RGB panel + Wi-Fi (ESP-FAQ, LCD section); the stock
;      prebuilt core lacks them and the picture jumps whenever Wi-Fi is busy. First build recompiles the core: slow.
;   P4 (envs ui-p4, ui-p4-debug): Guition JC4880P443, see [env:ui-p4].
; Board code: src/board/common + src/board/<s3|p4> (ui_select.py, custom_board).
;   build:  ./build-pio.sh ui     flash: ./build-pio.sh ui --flash   (never `pio run -t upload`: no --encrypt, no checks)
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
board_upload.flash_size = 16MB
board_build.partitions = partitions_app3M_fat9M_16MB.csv   ; local copy: hybrid compile needs a file in the project
monitor_speed = 115200
lib_deps =
    moononournation/GFX Library for Arduino@1.6.9

; the Sunton ESP32-S3 board (the S3 envs extend this; the P4 envs must not see its custom_sdkconfig)
[s3]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi   ; the module's flash is quad (eFuse says 4 data lines)
board_build.flash_mode = qio                 ; header stays "dio" (build-pio.sh, as ESP-IDF does): the bootloader switches to QIO
custom_board = s3
custom_sdkconfig =
    ; run code + read-only data from PSRAM: Wi-Fi / flash activity no longer stalls the PSRAM the panel reads from
    CONFIG_SPIRAM_FETCH_INSTRUCTIONS=y
    CONFIG_SPIRAM_RODATA=y
    ; 64-byte data cache line is required with bounce buffers
    CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
    '# CONFIG_ESP32S3_DATA_CACHE_LINE_32B is not set'
    ; keep Wi-Fi / lwIP buffers in internal RAM (less PSRAM traffic)
    '# CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP is not set'
    ; panel ISR keeps running during flash operations (safe now that PSRAM stays reachable)
    CONFIG_LCD_RGB_ISR_IRAM_SAFE=y
    CONFIG_LCD_RGB_RESTART_IN_VSYNC=y
    CONFIG_COMPILER_OPTIMIZATION_PERF=y
    '# CONFIG_COMPILER_OPTIMIZATION_SIZE is not set'
    CONFIG_FREERTOS_HZ=1000
    ; task stacks trimmed to what they use (measured, debug GET /tasks), for internal RAM: esp_timer used < 0.5 of
    ; 8 KB, mdns ~1.7 of 4 KB
    CONFIG_ESP_TIMER_TASK_STACK_SIZE=4096
    CONFIG_MDNS_TASK_STACK_SIZE=3072
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -Iinclude
    -Isrc/board/s3
    -Isrc/board/common
    -DLV_CONF_INCLUDE_SIMPLE
    -DPANEL_PCLK_HZ=16000000
    -DPANEL_BOUNCE_PX=8000

[env:touchtest]
extends = s3
build_src_filter = -<*> +<board/s3/panel.cpp> +<board/common/touch_gt911.cpp> +<touchtest/>

[env:ui]
extends = s3
; the core, the board layer and ONE UI folder: src/ui (Brewdeck's) unless BREWDECK_UI names another (ui_select.py;
; build-pio.sh: UI=ui_minimal ./build-pio.sh ui)
build_src_filter = -<*> +<board/common/> +<board/s3/> +<core/> +<ui/>   ; replaced by ui_select.py (board + UI folder)
extra_scripts = pre:ui_select.py
lib_deps =
    ${env.lib_deps}
    lvgl/lvgl@9.6.0

; the same app plus the debug web server (src/core/debug_http.cpp: GET /screen.bmp, /heap, /tasks, /flash, /roam,
; /touch, /bl on port 80, no password; tools/screenshot.sh). Release builds (env ui) leave it out.
[env:ui-debug]
extends = env:ui
build_flags =
    ${s3.build_flags}
    -DBREWDECK_DEBUG_HTTP

; Guition JC4880P443: ESP32-P4 rev 3, 4.3" 480x800 MIPI-DSI panel shown as 800x480 (rotated), GT911 touch, Wi-Fi
; through the on-board ESP32-C6 (esp-hosted over SDIO). A retail board: plain flash, no encryption (flash.sh asks the
; chip). Stock Arduino libraries, no custom_sdkconfig: the S3's settings are for its RGB panel. Note: pioarduino keeps
; ONE compiled copy of the Arduino libraries, so switching between S3 and P4 builds recompiles / reinstalls them.
;   ./build-pio.sh ui-p4 [--flash]      (backup: backup/p4-guition-original.bin)
[env:ui-p4]
board = esp32-p4_r3
board_build.arduino.memory_type = dio_qspi
board_build.flash_mode = dio
custom_board = p4
build_flags =
    -DBOARD_P4
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial = the USB-C port (USB-Serial-JTAG)
    -Iinclude
    -Isrc/board/p4
    -Isrc/board/common
    -DLV_CONF_INCLUDE_SIMPLE
build_src_filter = -<*> +<board/common/> +<board/p4/> +<core/> +<ui/>   ; replaced by ui_select.py
extra_scripts = pre:ui_select.py
lib_deps =
    ${env.lib_deps}
    lvgl/lvgl@9.6.0

[env:ui-p4-debug]
extends = env:ui-p4
build_flags =
    ${env:ui-p4.build_flags}
    -DBREWDECK_DEBUG_HTTP

; One-off tool, not Brewdeck: updates the P4 board's ESP32-C6 (Wi-Fi chip) to the ESP-Hosted version this core expects
; (src/c6update/main.cpp). ./build-pio.sh p4-c6-update --flash, read the log, then flash ui-p4 again.
[env:p4-c6-update]
extends = env:ui-p4
build_src_filter = -<*> +<c6update/>
extra_scripts =
lib_deps =
