; Brewdeck (unofficial Wi-Fi screen for Gaggiuino machines): two boards, one core and UI.
;   S3 (envs ui, ui-debug, touchtest; the default): 4.3" 800x480 ESP32-S3 RGB panel, Sunton ESP32-8048S043-style
;      board (N16R8, also the Gaggiuino Gen 3 screen). An ESP-IDF project like the P4 (see [env:ui]).
; The firmware is plain ESP-IDF (framework = espidf). Two small tools still use the Arduino core, as plain Arduino
; builds on its prebuilt libraries: touchtest and p4-c6-update.
;   P4 (envs ui-p4, ui-p4-debug): Guition JC4880P443, see [env:ui-p4].
; Board code: src/board/common + src/board/<s3|p4> (ui_select.py, custom_board).
;   build:  ./build.sh ui     flash: ./build.sh ui --flash   (never `pio run -t upload`: no --encrypt, no checks)
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = espidf
board_upload.flash_size = 16MB
board_build.partitions = partitions_app3M_fat9M_16MB.csv   ; local copy: ESP-IDF reads it from the project
monitor_speed = 115200

; the Sunton ESP32-S3 board (the S3 envs extend this)
[s3]
board = esp32-s3-devkitc-1
board_build.flash_mode = qio                 ; header stays "dio" (build.sh, as ESP-IDF does): the bootloader switches to QIO
custom_board = s3
build_flags =
    -Iinclude
    -Isrc/board/s3
    -Isrc/board/common
    -DLV_CONF_INCLUDE_SIMPLE
    -Werror=infinite-recursion   ; a function calling itself by mistake fails the build
    -DPANEL_PCLK_HZ=16000000
    -DPANEL_BOUNCE_PX=8000

; touch test (src/touchtest): a plain Arduino build on the stock prebuilt libraries
[env:touchtest]
extends = s3
framework = arduino
board_build.arduino.memory_type = qio_opi   ; the module's flash is quad (eFuse says 4 data lines), PSRAM octal
build_flags =
    ${s3.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
build_src_filter = -<*> +<board/common/touch_gt911.cpp> +<touchtest/>
lib_deps = moononournation/GFX Library for Arduino@1.6.9   ; draws the test's text (the firmware uses esp_lcd)

; An ESP-IDF project, like the P4: everything is compiled from source in the env's own build folder, with
; sdkconfig.base.esp32s3 + sdkconfig.brewdeck.esp32s3 (octal PSRAM, the settings Espressif recommends for an RGB panel
; + Wi-Fi: without them the picture jumps whenever Wi-Fi is busy) and the component versions locked in
; dependencies.lock.esp32s3 (src/idf_component.yml). First build ~3 min.
[env:ui]
extends = s3
board_build.esp-idf.preserve_source_file_extension = yes
; the core, the board layer and ONE UI folder: src/ui (Brewdeck's) unless BREWDECK_UI names another. ui_select.py
; sets the source filter from custom_board and the UI folder (build.sh: UI=ui_minimal ./build.sh ui)
extra_scripts = pre:ui_select.py
lib_deps =
    lvgl/lvgl@9.6.0

; the same app plus the debug web server (src/core/debug_http.cpp, port 80, no password; routes in
; docs/development.md). Release builds (env ui) leave it out.
[env:ui-debug]
extends = env:ui
build_flags =
    ${s3.build_flags}
    -DBREWDECK_DEBUG_HTTP

; Guition JC4880P443: ESP32-P4 rev 3, 4.3" 480x800 MIPI-DSI panel shown as 800x480 (rotated), GT911 touch, Wi-Fi
; through the on-board ESP32-C6 (esp-hosted over SDIO). A retail board: plain flash, no encryption (flash.sh asks the
; chip). An ESP-IDF project: everything is compiled from source in the env's own build folder, with
; sdkconfig.base.esp32p4 + sdkconfig.brewdeck.esp32p4 (XIP from PSRAM, ...) and the component versions locked in
; dependencies.lock.esp32p4 (CMakeLists.txt, src/CMakeLists.txt, src/idf_component.yml). A changed sdkconfig.base.* /
; sdkconfig.brewdeck.* is applied by build.sh (it removes the generated sdkconfig.<env>).
;   ./build.sh ui-p4 [--flash]      (backup: backup/p4-guition-original.bin)
[env:ui-p4]
board = esp32-p4_r3
board_build.flash_mode = dio
board_build.esp-idf.preserve_source_file_extension = yes
custom_board = p4
build_flags =
    -DBOARD_P4
    -Iinclude
    -Isrc/board/p4
    -Isrc/board/common
    -DLV_CONF_INCLUDE_SIMPLE
    -Werror=infinite-recursion   ; a function calling itself by mistake fails the build
extra_scripts = pre:ui_select.py
lib_deps =
    lvgl/lvgl@9.6.0

[env:ui-p4-debug]
extends = env:ui-p4
build_flags =
    ${env:ui-p4.build_flags}
    -DBREWDECK_DEBUG_HTTP

; One-off tool, not Brewdeck: updates the P4 board's ESP32-C6 (Wi-Fi chip) to the ESP-Hosted version the firmware
; expects (src/c6update/main.cpp). A plain Arduino build (its WiFi, HTTPClient and ESP-Hosted OTA).
; ./build.sh p4-c6-update --flash, read the log, then flash ui-p4 again.
[env:p4-c6-update]
framework = arduino
board = esp32-p4_r3
board_build.arduino.memory_type = dio_qspi
board_build.flash_mode = dio
custom_board = p4
custom_src_only = c6update
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial = the USB-C port (USB-Serial-JTAG)
    -Iinclude
extra_scripts = pre:ui_select.py
