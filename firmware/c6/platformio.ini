; Firmware for the Guition P4 board's ESP32-C6 (the Wi-Fi chip the P4 reaches over SDIO): ESP-Hosted's co-processor,
; built from Espressif's Wi-Fi station example (examples/wifi/sta/cp of esp-hosted-mcu, same version as the P4 host's
; esp_hosted in ../src/idf_component.yml). Espressif publishes C6 images only for 2.x. Not flashed directly: the C6
; updater (../src/c6update, env p4-c6-update) carries this image and installs it over the P4's SDIO link.
;   cd firmware && ./build.sh c6
[env:c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = espidf
board = esp32-c6-devkitc-1
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv
